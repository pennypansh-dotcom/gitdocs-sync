name: GitDocs Sync — Docusaurus i18n & Docs Translation
description: "AI-powered Docusaurus i18n and markdown documentation translation. Diff-based: only translates changed paragraphs to keep costs low. Translation memory ensures consistent terminology. Auto-creates PRs for human review. Supports DeepSeek (native-quality Chinese) and OpenAI. Free for open source."
branding:
  icon: languages
  color: green
inputs:
  github_token:
    description: GitHub token with contents, pull-requests, and issues write permissions.
    required: true
  dry_run:
    description: Plan the sync without creating translation PRs or calling translation providers.
    required: false
    default: "false"
  license_key:
    description: GitDocs Sync license key. Free and dry-run usage also require a key.
    required: false
runs:
  using: node20
  main: dist/index.js
