name: Publish website and blog

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build-blog.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-website
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate blog pages
        run: npm run site:blog
      - name: Check generated website
        run: node --test test/blog.test.js test/site.test.js
      - name: Prepare public website folder
        run: |
          mkdir _site
          cp -R site/. _site/
          rm -rf _site/blog/posts
          rm -f _site/blog/README.md
      - name: Publish to the existing GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          cname: pawsitivetime.com
