name: GitDocs Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**/*.md"
      - "docs/**/*.mdx"
  issue_comment:
    types: [created]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # In a customer docs repo, replace this with the published Action, for example:
      # uses: pennypansh-dotcom/gitdocs-sync@v0.1.0
      - uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: "true"
          license_key: ${{ secrets.GITDOCS_LICENSE_KEY }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Add later when testing non-Chinese target languages.
          # OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
